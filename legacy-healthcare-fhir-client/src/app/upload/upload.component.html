<div class="container-fluid p-0">
    <div class="mb-4">
        <h2 class="fw-bold">Upload Legacy Data</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="row">
                <div class="col-md-8">
                    <label for="sourceFile" class="form-label fw-semibold">Source File</label>
                    <input id="sourceFile" type="file" class="form-control" accept=".csv"
                        (change)="onFileChange($event)">

                    <p class="small text-muted mt-2">

                    </p>
                </div>

                <div class="col-md-4">
                    <label for="targetStandard" class="form-label fw-semibold">Target Standard</label>

                    <select id="targetStandard" class="form-select" [value]="selectedStandard"
                        (change)="onStandardChange($event)">
                        <option value="FHIR">FHIR</option>
                        <option value="HL7 v2">HL7 v2</option>
                        <option value="C-CDA">C-CDA</option>
                    </select>
                </div>
            </div>

            @if (standardErrorMessage) {
            <div class="alert alert-warning">
                {{standardErrorMessage}}
            </div>
            }

            <button class="btn btn-primary" [disabled]="!isConvertBtnEnabled" (click)="onConvertBtnClick()">
                Convert
            </button>
        </div>
    </div>

    @if(jobBridgeService.getJobId()){
    <app-job-progress></app-job-progress>
    }
</div>
